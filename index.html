/* Le Cartographe — mise en page : chrome encre de nuit, parchemin sur la carte */
:root {
  --night: #15242c;
  --night-2: #1e323b;
  --night-3: #2a434e;
  --line: #3b5864;
  --paper: #eadfc0;
  --paper-2: #d8c698;
  --paper-ink: #3a2c1c;
  --text: #efe6cf;
  --muted: #a9b9b4;
  --brass: #d2a94b;
  --seal: #b8402a;
  --seal-2: #d4573d;
  --river: #3f7194;
  --ok: #3f8a52;
  --ko: #c4382c;
  --near: #c58a1d;
  --font-display: 'IM Fell English', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --font-caps: 'Cinzel', 'IM Fell English SC', 'Iowan Old Style', Georgia, serif;
  --font-sc: 'IM Fell English SC', 'IM Fell English', Georgia, serif;
  --font-ui: 'Alegreya Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --fs: 1;
  color-scheme: dark;
}
:root[data-cb="1"] { --ok: #2a79c4; --ko: #e08a2c; --near: #8d6cc0; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night); color: var(--text);
  font-family: var(--font-ui); font-size: calc(17px * var(--fs)); line-height: 1.35;
  overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

#app { position: relative; height: 100%; width: 100%; overflow: hidden; }
.screen { position: absolute; inset: 0; display: none; }
.screen.on { display: flex; flex-direction: column; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- boutons ---------- */
.btn {
  min-height: 48px; padding: 10px 20px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--night-2); cursor: pointer; font-weight: 700; letter-spacing: .02em;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--seal); border-color: var(--seal-2); color: #fff6ea; }
.btn.brass { background: var(--brass); border-color: #e7c874; color: #2a1f08; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: default; }
a.btn { color: var(--text); }
.btn.small { min-height: 44px; padding: 6px 12px; font-size: .92em; }
.linkbtn { background: none; border: 0; color: var(--brass); text-decoration: underline; padding: 10px 4px; min-height: 44px; cursor: pointer; }

/* ---------- écran titre ---------- */
#title { align-items: center; justify-content: center; text-align: center; gap: 18px;
  background:
    radial-gradient(ellipse at 50% 38%, #2c4854 0%, transparent 62%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 38px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 38px),
    var(--night); }
#title.art { overflow: hidden; isolation: isolate; justify-content: flex-start; padding-top: 9vh; }
/* illustration au format téléphone, centrée ; les côtés reprennent la même image, floutée et assombrie */
#title.art::before, #title.art::after { content: ''; position: absolute; top: 0; bottom: 0; z-index: -1; background-repeat: no-repeat; background-position: center bottom; background-size: cover; }
#title.art::before { left: 0; right: 0; background-image: var(--tbg); filter: blur(26px) brightness(.55) saturate(1.1); transform: scale(1.2); }
#title.art::after { left: 50%; width: min(100%, calc(100dvh * .558)); transform: translateX(-50%); background-image: var(--tshade), var(--tbg); box-shadow: 0 0 40px rgba(0,0,0,.6), inset 0 0 0 1.5px rgba(214,178,90,.75), inset 0 0 0 4px rgba(20,12,4,.55); }
#title.art h1 { text-shadow: 0 2px 14px rgba(0,0,0,.7); }
#title.art p.tag { color: #e4d6ae; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
#title.art .stack { margin-top: auto; margin-bottom: 9vh; }
#title .rose { width: 108px; height: 108px; opacity: .9; }
#title h1 { font-size: clamp(2.2rem, 11vw, 3.6rem); letter-spacing: .02em; color: var(--paper); }
#title p.tag { margin: 0; max-width: 22ch; color: var(--muted); font-size: 1.08em; }
#title .stack { display: flex; flex-direction: column; gap: 10px; width: min(300px, 100%); margin-top: 8px; }
#title .ver { position: absolute; bottom: max(10px, env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: .8em; opacity: .7; }

/* ---------- barre haute commune ---------- */
.topbar { display: flex; align-items: center; gap: 8px; min-height: 52px; padding-block: 4px; background: var(--night-2); border-bottom: 1px solid var(--line); }
.topbar h2 { flex: 1; min-width: 0; font-size: 1.15em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--paper); }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; border-radius: 6px; cursor: pointer; font-size: 1.25em; }
.iconbtn:active { background: var(--night-3); }
.scroll { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

/* ---------- atlas ---------- */
#atlas .body, #free .body { flex: 1; padding-block: 14px 24px; display: flex; flex-direction: column; gap: 12px; }
.lead { margin: 0; color: var(--muted); }
.region { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--night-2); text-align: left; width: 100%; cursor: pointer; min-height: 72px; }
.region[disabled] { opacity: .5; cursor: default; }
.region .thumb { width: 64px; height: 64px; border-radius: 4px; background: var(--paper-2); border: 1px solid var(--line); flex: none; object-fit: cover; display: grid; place-items: center; color: var(--paper-ink); font-family: var(--font-display); font-size: 1.6em; }
.region .meta { flex: 1; min-width: 0; }
.region .nm { font-family: var(--font-display); font-size: 1.12em; color: var(--paper); }
.region .sub { color: var(--muted); font-size: .88em; }
.starsrow { letter-spacing: .12em; color: var(--brass); font-size: 1.05em; white-space: nowrap; }
.starsrow .off { color: var(--night-3); }
.notes { display: flex; flex-direction: column; gap: 8px; }
.note { padding: 10px 12px; border-left: 3px solid var(--brass); background: var(--night-2); font-family: var(--font-display); font-style: italic; color: var(--paper); }
.note small { display: block; font-family: var(--font-ui); font-style: normal; color: var(--muted); }
h3.sec { font-size: 1.05em; color: var(--brass); margin-top: 6px; }

/* ---------- briefing ---------- */
#briefing { justify-content: center; align-items: center; padding-block: 20px; background: radial-gradient(ellipse at 50% 20%, #2c4854, var(--night) 70%); }
#briefing .scroll-card { width: min(520px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 14px; }
#briefing .parch { background: var(--paper); color: var(--paper-ink); border-radius: 4px; padding: 20px 20px 18px; box-shadow: 0 10px 28px rgba(0,0,0,.45); white-space: pre-line; font-family: var(--font-display); font-size: calc(1.2rem * var(--fs)); line-height: 1.45; }
#briefing .parch .rg { font-family: var(--font-ui); font-size: .74em; letter-spacing: .14em; text-transform: uppercase; color: #7a6342; display: block; margin-bottom: 6px; }
#briefing .parch h2 { font-size: 1.7rem; margin-bottom: 10px; }
#briefing .hint { border-top: 1px dashed #a38a59; margin-top: 12px; padding-top: 10px; font-size: .86em; font-style: italic; color: #5b4730; }

/* ---------- jeu ---------- */
#game.on { display: grid; }
#game { height: 100%;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto auto minmax(0, 1fr) auto;
  grid-template-areas: "top" "tut" "map" "panel" "bar"; }
#game .topbar { grid-area: top; }
#mapwrap { grid-area: map; position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: 47vh; background: #2a2118; touch-action: none; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#panel { grid-area: panel; min-height: 0; background: var(--night); border-top: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain; }
#bar { grid-area: bar; display: flex; gap: 8px; align-items: stretch; padding-top: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); background: var(--night-2); border-top: 1px solid var(--line); }
#bar .btn { flex: 1; min-height: 52px; }
#bar .btn.active { background: var(--night-3); border-color: var(--brass); color: var(--paper); }
#bar .btn.seal { flex: 1.35; }
.mapfloat { position: absolute; display: flex; gap: 6px; }
.mapfloat.tr { top: 8px; right: 8px; flex-direction: column; }
.mapfloat.bl { bottom: 8px; left: 8px; }
.mapfloat button { min-width: 44px; min-height: 44px; border-radius: 22px; background: rgba(21,36,44,.82); border: 1px solid var(--line); color: var(--text); cursor: pointer; padding: 0 12px; font-weight: 700; }
.mapfloat button.on { border-color: var(--brass); color: var(--brass); }
.maphint { position: absolute; left: 8px; right: 60px; bottom: 8px; padding: 6px 10px; border-radius: 6px; background: rgba(21,36,44,.88); color: var(--text); font-size: .86em; pointer-events: none; }

@media (min-aspect-ratio: 5/4) and (min-width: 700px) {
  #game.on { grid-template-columns: minmax(0, 1.5fr) minmax(340px, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto;
    grid-template-areas: "top top" "tut tut" "map panel" "map bar"; }
  #mapwrap { aspect-ratio: auto; max-height: none; height: 100%; }
}

/* panneau Outils */
.pad { padding-block: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
.pad h3 { font-size: 1em; color: var(--brass); letter-spacing: .04em; }
.help { margin: 0; color: var(--muted); font-size: .88em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 82px; min-height: 76px; padding: 6px 4px 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--paper-ink); cursor: grab; touch-action: none; position: relative; }
.chip canvas { width: 38px; height: 38px; pointer-events: none; }
.chip span { font-size: .72em; line-height: 1.1; text-align: center; pointer-events: none; font-weight: 700; }
.chip.done { background: var(--night-2); color: var(--muted); border-style: dashed; }
.chip.done canvas { opacity: .45; }
.chip.armed { outline: 3px solid var(--brass); }
.chip .ck { position: absolute; top: 2px; right: 4px; font-size: .8em; color: var(--ok); }
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.tool { min-height: 56px; padding: 6px 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--night-2); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: .84em; text-align: center; }
.tool b { font-size: 1.35em; font-weight: 400; line-height: 1; }
.tool.on { border-color: var(--brass); background: var(--night-3); color: var(--paper); }
.tool[disabled] { opacity: .4; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .84em; color: var(--muted); }

/* carnet */
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--night-2); overflow: hidden; }
.card > header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-height: 56px; cursor: pointer; width: 100%; background: none; border: 0; text-align: left; }
.card .em { font-size: 1.7em; width: 40px; text-align: center; flex: none; }
.card .who { flex: 1; min-width: 0; }
.card .who b { font-family: var(--font-display); font-weight: 400; font-size: 1.1em; color: var(--paper); display: block; }
.card .who i { color: var(--muted); font-size: .86em; font-style: normal; }
.card .chev { color: var(--muted); transition: transform .15s; }
.card.open .chev { transform: rotate(90deg); }
.card .inner { display: none; padding: 0 12px 12px; flex-direction: column; gap: 8px; }
.card.open .inner { display: flex; }
.trait { margin: 0; color: var(--muted); font-size: .88em; font-style: italic; }
.stmt { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; background: var(--night); border: 1px solid transparent; }
.stmt.pinned { border-color: var(--brass); background: #2a2b24; }
.stmt .tx { flex: 1; min-width: 0; font-family: var(--font-display); font-size: 1.04em; color: var(--paper); line-height: 1.3; }
.stmt .tx small { display: block; font-family: var(--font-ui); font-size: .74em; letter-spacing: .08em; text-transform: uppercase; color: var(--brass); margin-bottom: 2px; }
.pinbtn { flex: none; width: 44px; height: 44px; margin: -8px -8px -8px 0; background: none; border: 0; cursor: pointer; font-size: 1.15em; color: var(--muted); border-radius: 6px; }
.pinbtn.on { color: var(--brass); }
.badge { flex: none; align-self: center; min-width: 26px; height: 26px; display: inline-grid; place-items: center; border-radius: 13px; font-weight: 800; font-size: .86em; color: #fff; }
.badge.ok { background: var(--ok); }
.badge.ko { background: var(--ko); border-radius: 4px; transform: rotate(45deg); }
.badge.ko i { transform: rotate(-45deg); font-style: normal; }
.badge.na { background: var(--night-3); color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.check { display: flex; gap: 10px; align-items: center; min-height: 44px; cursor: pointer; color: var(--text); }
.check input { width: 24px; height: 24px; accent-color: var(--seal); }
.tokenbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* bulle de tutoriel */
#tut { grid-area: tut; padding-top: 8px; padding-bottom: 8px; background: var(--paper); color: var(--paper-ink); border-bottom: 2px solid #b09a6a; display: none; gap: 10px; align-items: center; }
#tut.on { display: flex; }
#tut .t { flex: 1; min-width: 0; font-size: .96em; }
#tut .t small { display: block; color: #7a6342; font-size: .76em; letter-spacing: .08em; text-transform: uppercase; }
#tut button { min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #b09a6a; background: #f4ead0; color: var(--paper-ink); font-weight: 700; cursor: pointer; }
#tut button.skip { background: none; border-color: transparent; text-decoration: underline; padding: 0 6px; font-weight: 400; }

/* résultat */
.stars { font-size: 2.4em; letter-spacing: .16em; color: var(--brass); text-align: center; line-height: 1; }
.stars .off { color: var(--night-3); }
.scoreline { text-align: center; font-family: var(--font-display); font-size: 1.15em; color: var(--paper); }
.row { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: .92em; }
.row .nm { flex: 1; min-width: 0; }
.row .sc { color: var(--muted); font-size: .86em; }
.verd { font-weight: 800; }
.verd.ok { color: var(--ok); } .verd.near { color: var(--near); } .verd.ko { color: var(--ko); }
.liar { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--night-2); }
.liar b { color: var(--paper); font-family: var(--font-display); font-weight: 400; }
.orlan { padding: 12px 14px; background: var(--paper); color: var(--paper-ink); border-radius: 4px; font-family: var(--font-display); font-style: italic; font-size: 1.1em; }
.orlan small { display: block; font-family: var(--font-ui); font-style: normal; color: #7a6342; letter-spacing: .08em; text-transform: uppercase; font-size: .68em; margin-bottom: 4px; }
.maplegend { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 12px; padding: 5px 10px; border-radius: 6px; background: rgba(21,36,44,.88); font-size: .8em; pointer-events: none; }
.maplegend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 5px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow .btn { flex: 1 1 140px; }
.optstack { display: flex; flex-direction: column; gap: 8px; }
.optstack .btn { width: 100%; }

/* fenêtre modale + toast */
#modal { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(8,14,18,.72); padding: 16px; }
#modal.on { display: flex; }
#modal .box { width: min(440px, 100%); max-height: 100%; overflow-y: auto; background: var(--night-2); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
#modal h2 { font-size: 1.3em; color: var(--paper); }
#modal p { margin: 0; }
#modal textarea { width: 100%; min-height: 90px; background: var(--night); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: .8em; padding: 8px; -webkit-user-select: text; user-select: text; }
.seg { display: flex; gap: 6px; }
.seg .btn { flex: 1; min-height: 44px; padding: 6px 8px; }
.seg .btn.on { background: var(--night-3); border-color: var(--brass); color: var(--paper); }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.setrow > span { flex: none; }
.setrow.vol input[type=range] { flex: 1; min-width: 0; height: 44px; accent-color: #8a5a2b; }
.setrow.vol > span { min-width: 5.6em; }
.setrow.vol output { flex: none; min-width: 3.4em; text-align: right; font-variant-numeric: tabular-nums; }
#toast { position: absolute; z-index: 30; left: 50%; bottom: max(80px, calc(env(safe-area-inset-bottom, 0px) + 72px)); transform: translateX(-50%); max-width: 90%; padding: 10px 16px; border-radius: 22px; background: var(--paper); color: var(--paper-ink); font-weight: 700; display: none; pointer-events: none; text-align: center; }
#toast.on { display: block; }

#dragghost { position: fixed; z-index: 50; pointer-events: none; width: 54px; height: 54px; margin: -27px 0 0 -27px; display: none; }
#dragghost.on { display: block; }

@media (max-height: 640px) and (max-aspect-ratio: 5/4) { #mapwrap { max-height: 36vh; } }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- illustrations ---------- */
img.ico { width: 1.25em; height: 1.25em; object-fit: contain; vertical-align: -.25em; pointer-events: none; }
img.ico.sm { width: 1.5em; height: 1.5em; }
img.ico.xs { width: 1.2em; height: 1.2em; }
img.ico.big { width: 1em; height: 1em; }
.tool b img.ico { width: 1.7em; height: 1.7em; }
.stars { display: flex; justify-content: center; gap: .14em; font-size: 2.6em; line-height: 1; }
.stars img.ico.big { width: 1.15em; height: 1.15em; }
.starsrow { display: inline-flex; gap: 2px; align-items: center; }
.starsrow img.ico { width: 1.05em; height: 1.05em; }
.chip img { width: 50px; height: 42px; object-fit: contain; pointer-events: none; filter: drop-shadow(0 1px 1px rgba(60,40,10,.35)); }
.chip.done img { opacity: .4; }
img.portrait { object-fit: cover; border-radius: 50%; border: 2px solid var(--brass); background: var(--paper); flex: none; pointer-events: none; }
img.portrait.card { width: 46px; height: 46px; }
img.portrait.sm { width: 34px; height: 34px; vertical-align: middle; margin-right: 6px; }
img.portrait.xs { width: 26px; height: 26px; border-width: 1px; }
.liar b { vertical-align: middle; }
#briefing img.scene { display: block; width: 100%; border-radius: 4px; margin-bottom: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
#briefing .parch { position: relative; }
#briefing img.king { float: right; width: 74px; height: 74px; margin: -6px -6px 6px 10px; border-radius: 50%; border: 2px solid #8a6a2a; object-fit: cover; background: #efe5c8; }
#ribbon { position: absolute; left: 8px; right: 60px; top: 8px; display: none; flex-direction: column; gap: 4px; pointer-events: none; max-height: 46%; overflow: hidden; }
#ribbon .rb { pointer-events: auto; display: flex; align-items: center; gap: 8px; text-align: left; min-height: 34px; padding: 4px 8px; border: 1px solid #8a6a2a; border-radius: 6px; background: rgba(244,234,208,.93); color: #2f2314; font-family: var(--font-display); font-size: .86em; line-height: 1.2; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
#ribbon .rb span { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#ribbon .rb i { font-style: normal; font-weight: 800; color: #7a6342; padding: 0 2px; }

.kingsay { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
.kingsay h3 { margin: 0 0 4px; }
.kingsay p { margin: 0; font-family: var(--font-display); font-style: italic; color: var(--paper); line-height: 1.3; }
img.portrait.md { width: 64px; height: 64px; }
@keyframes pop { 0% { transform: scale(.2) rotate(-25deg); opacity: 0; } 60% { transform: scale(1.3) rotate(6deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
img.pop, .stars .pop { animation: pop .5s cubic-bezier(.2,.9,.3,1.2) both; }
.verdicts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0 2px; }
.vchip { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--night-2); font-size: .8em; }
.vchip img { width: 26px; height: 24px; object-fit: contain; }
.vchip .wave { font-size: 1.2em; color: #78acce; width: 26px; text-align: center; }
.vchip i { font-style: normal; font-weight: 800; }
.vchip.ok { border-color: var(--ok); } .vchip.ok i { color: var(--ok); }
.vchip.near { border-color: #c58a1d; } .vchip.near i { color: #c58a1d; }
.vchip.ko, .vchip.missing { border-color: var(--ko); } .vchip.ko i, .vchip.missing i { color: var(--ko); }
@media (prefers-reduced-motion: reduce) { img.pop, .stars .pop { animation: none; } }
.stmt { cursor: pointer; }

#bar .btn { min-width: 0; padding-left: 6px; padding-right: 6px; font-size: .95em; line-height: 1.15; }
#bar .btn { font-size: .9em; }


/* =====================================================================
   HABILLAGE — cuivre, cire et parchemin
   ===================================================================== */
:root {
  --brass-hi: #f0d68a; --brass-lo: #8a6420; --wood: #10181d;
  --shadow-btn: 0 2px 0 rgba(0,0,0,.45), 0 6px 14px rgba(0,0,0,.28);
}
body { background: radial-gradient(120% 90% at 50% 0%, #1d3340 0%, var(--night) 55%, #0e181e 100%); }
.screen.on { animation: scr .32s ease-out both; }
@keyframes scr { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* boutons */
.btn {
  border-radius: 10px; border: 1px solid #5a7b88;
  background: linear-gradient(180deg, #36535f 0%, #263f4a 52%, #1f343e 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.13), inset 0 -1px 0 rgba(0,0,0,.3), var(--shadow-btn);
  text-shadow: 0 1px 0 rgba(0,0,0,.45); transition: transform .08s, filter .15s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 rgba(0,0,0,0); }
.btn.primary {
  font-family: var(--font-caps); font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  background: linear-gradient(180deg, #d4573d 0%, #b8402a 48%, #8f2f1e 100%);
  border: 1px solid var(--brass); color: #fff3df;
  box-shadow: inset 0 1px 0 rgba(255,220,180,.4), inset 0 0 0 2px rgba(0,0,0,.18), 0 0 0 1px #5a2415, var(--shadow-btn);
}
.btn.brass { background: linear-gradient(180deg, #f0d68a, #d2a94b 55%, #b3862f); border-color: #f6e4ae; text-shadow: 0 1px 0 rgba(255,255,255,.35); }
.btn.ghost { background: rgba(10,20,26,.35); box-shadow: inset 0 0 0 1px rgba(255,255,255,.04); }
.btn.small { border-radius: 9px; }
.iconbtn { border-radius: 12px; }
.linkbtn { font-family: var(--font-sc); font-size: 1.08em; letter-spacing: .03em; }

/* écran titre */
#title .wordmark { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 4px; }
#title .wm-small { display: flex; align-items: center; gap: 12px; width: min(300px, 80vw); justify-content: center; }
#title .wm-small i { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--brass)); }
#title .wm-small i:last-child { background: linear-gradient(270deg, transparent, var(--brass)); }
#title .wm-small b { font-family: var(--font-caps); font-weight: 700; font-size: 1.15rem; letter-spacing: .5em; text-indent: .5em; text-transform: uppercase; color: var(--brass-hi); text-shadow: 0 2px 0 #3a2206, 0 3px 10px rgba(0,0,0,.7); }
#title h1 {
  font-family: var(--font-caps); font-weight: 700; text-transform: uppercase; line-height: 1.02;
  font-size: clamp(2rem, 9.6vw, 3.5rem); letter-spacing: .05em; text-indent: .05em; color: transparent;
  background:
    linear-gradient(105deg, transparent 38%, rgba(255,255,255,.75) 50%, transparent 62%) 160% 0 / 250% 100% no-repeat,
    linear-gradient(180deg, #fff3c4 0%, #f0d68a 26%, #d2a94b 50%, #9a6a1c 66%, #e6c26a 100%);
  -webkit-background-clip: text; background-clip: text;
  filter: drop-shadow(0 2px 0 #3a2206) drop-shadow(0 5px 14px rgba(0,0,0,.75));
  animation: sheen 7s ease-in-out 1.2s infinite;
}
@keyframes sheen { 0%, 55% { background-position: 160% 0, 0 0; } 100% { background-position: -60% 0, 0 0; } }
#title .wm-orn { width: min(250px, 72vw); margin-top: 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
#title .wm-orn svg { width: 100%; height: auto; display: block; }
#title.art p.tag { font-family: var(--font-display); font-style: italic; font-size: 1.22em; max-width: 24ch; color: #f1e4bb; text-shadow: 0 1px 0 #000, 0 2px 12px rgba(0,0,0,.9); margin-top: 4px; }
#title .stack { gap: 12px; }
#title .stack .btn { min-height: 54px; font-size: 1em; }
#title .stack .btn.primary { min-height: 62px; font-size: 1.14em; }
#title .stack .btn:not(.primary) { background: linear-gradient(180deg, rgba(34,56,66,.92), rgba(20,36,44,.94)); border-color: #7c6a3a; font-family: var(--font-sc); font-size: 1.12em; letter-spacing: .06em; backdrop-filter: blur(4px); }
#title .ver { font-family: var(--font-sc); letter-spacing: .08em; color: #c9bb93; text-shadow: 0 1px 6px #000; opacity: .85; }

/* barre haute & titres */
.topbar { background: linear-gradient(180deg, #243b46, #1a2c35); border-bottom: 1px solid #0b1317; box-shadow: 0 1px 0 rgba(210,169,75,.45), 0 4px 12px rgba(0,0,0,.3); position: relative; z-index: 2; }
.topbar h2 { font-family: var(--font-sc); font-size: 1.25em; letter-spacing: .03em; color: var(--brass-hi); text-shadow: 0 1px 0 #000; }
.pad h3, h3.sec { font-family: var(--font-sc); font-size: 1.14em; letter-spacing: .05em; color: var(--brass); display: flex; align-items: center; gap: 10px; }
.pad h3::after, h3.sec::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(210,169,75,.55), transparent); }
.kingsay h3::after { display: none; }

/* atlas */
.lead { font-family: var(--font-display); font-style: italic; font-size: 1.1em; color: #c9d6d1; }
.region { padding: 10px; border-radius: 14px; border: 1px solid #496875; gap: 14px;
  background: linear-gradient(180deg, #2a4450, #1d313b); box-shadow: inset 0 1px 0 rgba(255,255,255,.07), var(--shadow-btn); transition: transform .1s, filter .15s; }
.region:not([disabled]):hover { filter: brightness(1.07); }
.region:not([disabled]):active { transform: translateY(2px); }
.region .thumb { width: 78px; height: 78px; border-radius: 10px; border: 2px solid var(--brass); box-shadow: 0 3px 8px rgba(0,0,0,.5); }
.region[disabled] .thumb { filter: grayscale(1) brightness(.6); }
.region .nm { font-size: 1.28em; line-height: 1.12; color: #f6ecd0; }
.region .sub { font-family: var(--font-sc); letter-spacing: .05em; color: #b5c4bf; font-size: .95em; }
.note { border-left: 4px solid var(--brass); border-radius: 0 8px 8px 0; background: linear-gradient(90deg, #223943, #1b2e37); }

/* briefing */
#briefing .parch { border-radius: 8px; background: linear-gradient(170deg, #f1e7c9 0%, #e6d6a8 60%, #dcc891 100%); border: 1px solid #a38a59; box-shadow: inset 0 0 0 4px rgba(244,234,208,.6), inset 0 0 0 5px rgba(138,106,42,.55), 0 14px 32px rgba(0,0,0,.5); padding: 24px 22px 20px; }
#briefing .parch .rg { font-family: var(--font-sc); letter-spacing: .12em; font-size: .9em; }
#briefing .parch h2 { font-family: var(--font-sc); font-size: 1.85rem; line-height: 1.1; }
#briefing img.scene { border: 2px solid #8a6a2a; box-shadow: 0 0 0 4px #1a2a32, 0 10px 26px rgba(0,0,0,.55); border-radius: 6px; }

/* jeu : cadre de la carte, boutons flottants, barre du bas */
#mapwrap { box-shadow: inset 0 0 0 3px #4a361c, inset 0 0 0 4px #8a6a2a, inset 0 0 26px rgba(0,0,0,.55); }
.mapfloat button { width: 46px; height: 46px; border-radius: 50%; padding: 0; font-size: 1.25em; background: radial-gradient(circle at 35% 30%, #3b5967, #1b2e37); border: 1.5px solid var(--brass); color: var(--brass-hi); box-shadow: 0 3px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.14); }
.mapfloat button:active { transform: scale(.94); }
.maphint { border-radius: 10px; border: 1px solid var(--brass-lo); background: rgba(16,26,32,.92); font-family: var(--font-display); font-style: italic; font-size: .98em; }
#panel { background: radial-gradient(120% 60% at 50% 0%, #1c3039, #141f26 70%); border-top: 0; box-shadow: inset 0 3px 8px rgba(0,0,0,.45); }
#bar { background: linear-gradient(180deg, #22343d, #0f171c); border-top: 1px solid var(--brass-lo); box-shadow: 0 -1px 0 rgba(0,0,0,.6), 0 -6px 14px rgba(0,0,0,.3); gap: 10px; }
#bar .btn { font-family: var(--font-sc); font-size: 1.04em; letter-spacing: .03em; border-radius: 12px; }
#bar .btn.active { background: linear-gradient(180deg, #43616d, #2c4752); border-color: var(--brass); color: #fff3d1; box-shadow: inset 0 -3px 0 var(--brass), var(--shadow-btn); }
#bar .btn.seal { font-family: var(--font-caps); font-size: .92em; letter-spacing: .06em; text-transform: uppercase; }

/* palette & outils */
.chip { border-radius: 12px; border: 1px solid #a38a59; background: linear-gradient(180deg, #f2e8cb, #e0cf9f); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), 0 3px 0 #7b6330, 0 6px 12px rgba(0,0,0,.35); width: 86px; min-height: 84px; }
.chip span { font-family: var(--font-display); font-size: .82em; font-weight: 400; color: #3a2c1c; }
.chip:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), 0 1px 0 #7b6330; }
.chip.done { background: rgba(20,36,44,.7); border-color: #3b5864; box-shadow: none; }
.chip.done span { color: #93a69f; }
.chip.armed { outline: 3px solid var(--brass); outline-offset: 2px; }
.tool { border-radius: 12px; border: 1px solid #496875; background: linear-gradient(180deg, #2b4552, #1e323c); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 0 rgba(0,0,0,.4); min-height: 62px; font-family: var(--font-display); font-size: .96em; }
.tool.on { border-color: var(--brass); background: linear-gradient(180deg, #4a6876, #34505c); box-shadow: inset 0 -3px 0 var(--brass), 0 2px 0 rgba(0,0,0,.4); }
.tool:active { transform: translateY(1px); }

/* carnet */
.card { border-radius: 14px; border: 1px solid #496875; background: linear-gradient(180deg, #274049, #1c2f38); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 3px 8px rgba(0,0,0,.3); }
.card.open { border-color: var(--brass-lo); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 1px rgba(210,169,75,.25), 0 6px 14px rgba(0,0,0,.4); }
.card .who b { font-family: var(--font-sc); font-size: 1.22em; letter-spacing: .02em; color: #f6ecd0; }
.card .who i { font-family: var(--font-display); font-style: italic; font-size: .98em; }
img.portrait { border: 2.5px solid var(--brass); box-shadow: 0 2px 6px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.4); }
.trait { font-family: var(--font-display); font-size: .98em; color: #b9c9c3; }
.stmt { background: linear-gradient(180deg, #f1e7c9, #e5d5a7); color: var(--paper-ink); border: 1px solid #a38a59; border-left: 5px solid #a38a59; border-radius: 4px 8px 8px 4px; box-shadow: 0 2px 4px rgba(0,0,0,.35); padding: 10px 12px; transition: transform .1s; }
.stmt:active { transform: scale(.99); }
.stmt .tx { color: #2f2314; font-size: 1.08em; }
.stmt .tx small { color: #8a5a1c; font-family: var(--font-sc); font-size: .82em; letter-spacing: .06em; }
.stmt.pinned { background: linear-gradient(180deg, #f8efd0, #ecdca9); border-color: var(--seal); border-left-color: var(--seal); box-shadow: 0 0 0 1px rgba(184,64,42,.35), 0 3px 8px rgba(0,0,0,.4); }
.pinbtn { color: #9c8553; }
.pinbtn.on { color: var(--seal); }
.check { font-family: var(--font-display); font-size: 1.04em; }

/* tutoriel */
#tut { background: linear-gradient(180deg, #f1e7c9, #e3d3a4); border-bottom: 2px solid #8a6a2a; font-family: var(--font-display); box-shadow: 0 4px 12px rgba(0,0,0,.4); position: relative; z-index: 2; }
#tut .t { font-size: 1.08em; }
#tut .t small { font-family: var(--font-sc); }
#tut button { border-radius: 8px; background: linear-gradient(180deg, #fbf3da, #e8d9ac); }

/* résultat */
.stars img.ico.big { filter: drop-shadow(0 3px 5px rgba(0,0,0,.55)); }
.scoreline { font-family: var(--font-sc); font-size: 1.3em; letter-spacing: .03em; }
.liar { border-radius: 12px; background: linear-gradient(180deg, #274049, #1c2f38); border-color: #496875; }
.orlan { border-radius: 8px; border: 1px solid #a38a59; background: linear-gradient(170deg, #f1e7c9, #e3d3a4); box-shadow: inset 0 0 0 3px rgba(244,234,208,.55), 0 4px 10px rgba(0,0,0,.4); }
.vchip { background: linear-gradient(180deg, #2a4450, #1d313b); font-family: var(--font-display); font-size: .92em; }
.kingsay p { font-size: 1.12em; }

/* fenêtres & notifications : parchemin */
#modal { background: rgba(6,12,16,.78); backdrop-filter: blur(3px); }
#modal .box { background: linear-gradient(170deg, #f1e7c9, #e3d3a4); color: var(--paper-ink); border: 1px solid #8a6a2a; border-radius: 10px; box-shadow: inset 0 0 0 4px rgba(244,234,208,.55), inset 0 0 0 5px rgba(138,106,42,.5), 0 20px 50px rgba(0,0,0,.6); padding: 24px 22px; animation: scr .22s ease-out both; }
#modal h2 { font-family: var(--font-sc); font-size: 1.55em; color: #3a2c1c; letter-spacing: .02em; }
#modal p, #modal .setrow, #modal label { font-family: var(--font-display); font-size: 1.08em; color: #3a2c1c; }
#modal .btn { background: linear-gradient(180deg, #f7eed3, #e4d4a5); border-color: #a38a59; color: #3a2c1c; text-shadow: none; box-shadow: inset 0 1px 0 #fff8, 0 2px 0 #8a6a2a; font-family: var(--font-sc); font-size: 1.05em; }
#modal .btn.primary { background: linear-gradient(180deg, #d4573d, #a63522); color: #fff3df; border-color: var(--brass); font-family: var(--font-caps); text-shadow: 0 1px 0 rgba(0,0,0,.4); }
#modal .seg .btn.on { background: linear-gradient(180deg, #d9b861, #b8913a); border-color: #6a4c14; color: #2a1c06; }
#modal .linkbtn { color: #7a3420; }
#modal textarea { background: #f8f1da; color: #3a2c1c; border-color: #a38a59; }
#modal .help { color: #6b5a3c; }
#toast { background: linear-gradient(180deg, #f6edcf, #e3d3a4); border: 1px solid #8a6a2a; box-shadow: 0 6px 16px rgba(0,0,0,.5); font-family: var(--font-display); font-weight: 400; font-size: 1.05em; }
.region .sub { font-family: var(--font-display); letter-spacing: 0; font-size: 1em; }
.region .meta .sub:first-child { font-family: var(--font-sc); letter-spacing: .06em; font-size: .95em; }
#title h1 { font-size: clamp(1.9rem, 9vw, 3.4rem); }
/* écran titre en paysage / fenêtre basse : tout doit tenir sans recouvrir la version */
@media (max-height: 540px) {
  #title { gap: 8px; }
  #title.art { padding-top: max(10px, env(safe-area-inset-top, 0px)); }
  #title .rose { width: 64px; height: 64px; }
  #title .wm-small b { font-size: .95rem; }
  #title h1 { font-size: clamp(1.6rem, 10vh, 2.8rem); }
  #title .wm-orn { width: min(200px, 60vw); margin-top: 0; }
  #title.art p.tag { font-size: 1.05em; max-width: 40ch; margin-top: 0; }
  #title .stack { gap: 8px; margin-top: 4px; }
  #title.art .stack { margin-bottom: calc(max(10px, env(safe-area-inset-bottom, 0px)) + 24px); }
  #title .stack .btn { min-height: 44px; }
  #title .stack .btn.primary { min-height: 50px; }
}
@media (max-height: 360px) {
  #title { gap: 5px; }
  #title .stack { gap: 6px; }
  #title .stack .btn.primary { min-height: 44px; }
  #title.art p.tag { font-size: .95em; }
  #title .wm-orn { display: none; }
}

/* ═════════ V0.4 : barre d'outils latérale, médaillons, cartes finies, mode libre ═════════ */
#mapwrap { display: flex; }
#mapcol { position: relative; flex: 1; min-width: 0; height: 100%; overflow: hidden; }
#rail { display: none; flex-direction: column; justify-content: safe center; gap: 6px; width: 64px; flex: none; padding: 6px 4px; overflow-y: auto; z-index: 3;
  background: linear-gradient(90deg, #0b1519, #16262e); border-right: 1px solid var(--brass-lo); box-shadow: 2px 0 8px rgba(0,0,0,.4); scrollbar-width: none; }
#rail::-webkit-scrollbar { display: none; }
.rbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; width: 100%; min-height: 46px; padding: 3px 0 2px; border-radius: 10px; border: 1px solid #496875; cursor: pointer;
  background: linear-gradient(180deg, #2b4552, #1e323c); color: var(--text); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 0 rgba(0,0,0,.45); transition: transform .12s, box-shadow .12s; }
.rbtn .ri { height: 26px; display: grid; place-items: center; color: var(--brass-hi); }
.rbtn .ri img.ico { width: 26px; height: 26px; }
.rbtn .ri .ico.fb svg { width: 24px; height: 24px; display: block; }
.rbtn small { font-family: var(--font-sc); font-size: .75rem; line-height: 1; color: #cfdad6; letter-spacing: 0; white-space: nowrap; }
.rbtn.on { border-color: var(--brass); background: linear-gradient(180deg, #5f808d, #3b5b69); transform: scale(1.07);
  box-shadow: 0 0 0 2px var(--brass), 0 0 14px rgba(210,169,75,.6), inset 0 1px 0 rgba(255,255,255,.2); }
.rbtn.on small { color: #fff3d1; font-weight: 700; }
.rbtn:active { transform: scale(.95); }
.rbtn[disabled] { opacity: .34; box-shadow: none; }
#rtoggle { display: none; position: absolute; top: 8px; left: 8px; gap: 0; z-index: 3; border-radius: 22px; overflow: hidden; border: 1.5px solid var(--brass); box-shadow: 0 3px 8px rgba(0,0,0,.5); }
#rtoggle button { min-height: 44px; padding: 0 14px; border: 0; cursor: pointer; background: rgba(21,36,44,.9); color: var(--paper); font-family: var(--font-sc); font-size: .95em; display: flex; align-items: center; gap: 4px; }
#rtoggle button.on { background: linear-gradient(180deg, #f0d68a, #d2a94b 55%, #b3862f); color: #2a1f08; font-weight: 700; }
#rtoggle img.ico { width: 1.2em; height: 1.2em; }

/* médaillons de portrait */

  var SYNC_API = 'https://ks-sync.keismeystudio.workers.dev/v1/';   // adresse du Worker ; vide = synchro coupée

          canLater: true, onChoice: function (c) {

      // filet de sécurité si aucune page ne précède le jeu
      timer = setTimeout(function () { location.replace(url); }, 700);
    } else {
      location.replace(url);
    }
  }

  function toHub() {
    if (leaving) return;
    leaving = true;
    var k = depth(state());
    if (k > 0) history.go(-k); else finish();
  }

  function back(fromKey) {
    var r;
    if (window.KS && window.KS.closeDialog && window.KS.closeDialog()) return;   // fenêtre « Sauvegarde » commune
    try { r = cfg.back(); } catch (e) { r = null; if (window.console) console.error(e); }
    if (r === 'hub' && !fromKey) toHub();
  }

  window.addEventListener('popstate', function (e) {
    var k = depth(e.state);
    if (resetting) { if (k === 0) { resetting = false; idx = 0; } return; }
    if (leaving) { if (k === 0) finish(); return; }
    if (!cfg) { idx = k; return; }
    if (k >= idx) { idx = k; return; }   // bouton « suivant » : rien à faire
    idx = k;
    back(false);
  });

  // chaque action du joueur réarme les entrées tampon
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(function (t) {
    window.addEventListener(t, topUp, true);
  });

  // touche Échap sur ordinateur : même effet, sauf quitter le jeu
  window.addEventListener('keydown', function (e) {
    if (!cfg || e.key !== 'Escape' || e.repeat || e.defaultPrevented) return;
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    back(true);
  });

  // bouton « Hub » de l'écran titre
  var btn = null, btnLang = '';
  function hubButton() {
    var on = false;
    try { on = !!cfg.title() && !leaving; } catch (e) {}
    if (!btn) {
      if (!on || !document.body) return;
      var css = document.createElement('style');
      css.textContent = '.ks-hub{position:fixed;z-index:2147483000;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);' +
        'display:flex;align-items:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 14px 0 12px;box-sizing:border-box;' +
        'border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(10,12,16,.66);color:#fff;' +
        'font:600 15px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:0;text-transform:none;' +
        '-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
        '.ks-hub.tr{left:auto;right:calc(env(safe-area-inset-right,0px) + 10px)}.ks-hub[hidden]{display:none}' +
        '.ks-hub:focus-visible{outline:3px solid #fff;outline-offset:2px}.ks-hub svg{width:18px;height:18px;flex:none}';
      document.head.appendChild(css);
      btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ks-hub' + (cfg.hubCorner === 'tr' ? ' tr' : '');
      btn.innerHTML = '<svg viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1.5" fill="currentColor"/>' +
        '<rect x="10" y="2" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="2" y="10" width="6" height="6" rx="1.5" fill="currentColor"/>' +
        '<rect x="10" y="10" width="6" height="6" rx="1.5" fill="currentColor"/></svg><span>Hub</span>';
      // le toucher ne doit pas atteindre l'écran titre (« Touche pour commencer »)
      ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend'].forEach(function (t) {
        btn.addEventListener(t, function (e) { e.stopPropagation(); });
      });
      btn.addEventListener('click', function (e) { e.stopPropagation(); e.preventDefault(); toHub(); });
      document.body.appendChild(btn);
    }
    var l = cfg.lang && cfg.lang() === 'en' ? 'en' : 'fr';
    if (l !== btnLang) {
      btnLang = l;
      btn.title = l === 'en' ? 'Go to the Keismey Studio hub' : 'Aller au hub de Keismey Studio';
      btn.setAttribute('aria-label', btn.title);
    }
    if (btn.hidden === on) btn.hidden = !on;
  }

  window.addEventListener('pagehide', function () { clearTimeout(timer); });
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;            // page revenue depuis le cache du navigateur
    clearTimeout(timer); leaving = false; resetting = false; idx = depth(state());
  });

  window.KSBack = {
    init: function (o) {
      cfg = o;
      if (o && typeof o.title === 'function') { hubButton(); setInterval(function () { if (!document.hidden) hubButton(); }, 300); }
    },
    toHub: toHub,
    fromHub: function () { return fromHub; }
  };
})();

    S.asked = ip ? ip.asked || {} : {}; S.scoutsUsed = ip ? ip.scoutsUsed || 0 : 0;

  /* ───────────── entrées du carnet ───────────── */
  function entries() {
    var L = S.level, out = [];
    L.witnesses.forEach(function (w) {
      w.statements.forEach(function (st, i) { out.push({ key: w.id + ':' + i, st: st, w: w, kind: 'say' }); });
      if (S.asked[w.id] && w.ask) out.push({ key: w.id + ':r', st: w.ask.st, w: w, kind: 'reply', reply: w.ask.reply });
    });
    L.scouts.slice(0, S.scoutsUsed).forEach(function (st, i) { out.push({ key: 'scout:' + i, st: st, w: {}, kind: 'scout' }); });
    return out;
  }
  function ctxOf(w) {
    return { pos: function (id) { return S.placed[id] || null; }, path: function (id) { return S.drawn[id] || null; }, scale: S.level.scale, witness: w || {} };
  }
  function evalEntry(e) { return Core.evalStatement(e.st, ctxOf(e.w)); }
  function shownEntries() {
    var all = entries(), pinned = all.filter(function (e) { return S.pins[e.key]; });

    if (S.openCard) return all.filter(function (e) { return e.w && e.w.id === S.openCard; });
    return [];
  }

    var L = S.level;
